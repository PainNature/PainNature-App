<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pain Nature — Gestion des recettes</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6b3a1f">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<style>
.topbar{
  background:var(--wheat); color:#fff; padding:0 1.2rem; height:54px;
  display:flex; align-items:center; justify-content:space-between;
  box-shadow:0 2px 8px rgba(0,0,0,.2); position:sticky; top:0; z-index:10;
}
.topbar .marque{font-weight:800; font-size:1rem; display:flex; align-items:center; gap:.6rem;}
.topbar .marque .lock{font-size:.75rem; background:rgba(255,255,255,.2); padding:2px 9px; border-radius:10px; font-family:var(--mono);}
.topbar .retour{color:#fff; text-decoration:none; font-size:1.3rem; opacity:.85;}
.topbar .deco{background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); color:#fff; padding:6px 13px; border-radius:var(--r); font-size:.82rem; font-weight:600; cursor:pointer;}
main{max-width:980px; margin:1.2rem auto 3rem; padding:0 1.2rem;}

.tabs{display:flex; gap:8px; margin-bottom:1.1rem;}
.tab-btn{flex:1; padding:10px; border:1.5px solid var(--border); background:var(--surface); border-radius:var(--r); font-weight:700; font-size:.82rem; cursor:pointer; color:var(--text-muted);}
.tab-btn.active{background:var(--wheat); color:#fff; border-color:var(--wheat);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

table{width:100%; border-collapse:collapse;}
th{text-align:left; font-size:.7rem; text-transform:uppercase; letter-spacing:.04em; color:var(--text-light); padding:10px 12px; border-bottom:2px solid var(--border); font-family:var(--mono);}
td{padding:9px 12px; border-bottom:1px solid var(--border); font-size:.88rem;}
tr:last-child td{border-bottom:none;}
.input-mini{width:100%; padding:6px 8px; border:1.5px solid var(--border-strong); border-radius:var(--r); font-size:.85rem; font-family:var(--mono);}
.bio-tag{font-size:.68rem; background:var(--green-light); color:var(--green); padding:1px 7px; border-radius:9px; margin-left:5px;}

.btn-nouvelle{padding:9px 16px; font-size:.82rem;}
.bar-actions{display:flex; justify-content:flex-end; margin-bottom:.8rem;}

.fiche-recette{display:grid; grid-template-columns:280px 1fr; gap:1.2rem;}
@media (max-width:760px){.fiche-recette{grid-template-columns:1fr;}}

.liste-recettes-nav{max-height:560px; overflow-y:auto;}
.recette-nav-item{padding:11px 14px; border-bottom:1px solid var(--border); cursor:pointer; font-size:.88rem; font-weight:600;}
.recette-nav-item:hover{background:var(--surface2);}
.recette-nav-item.active{background:var(--wheat-light); color:var(--wheat); border-left:3px solid var(--wheat);}
.recette-nav-item.desactivee{opacity:.55; font-style:italic;}

.panneau-finance{padding:1.2rem;}
.panneau-finance h3{color:var(--wheat); margin-bottom:1rem; font-size:1.05rem;}

.mode-toggle{display:flex; gap:8px; margin-bottom:1.1rem;}
.mode-btn{flex:1; padding:9px; border:1.5px solid var(--border); background:var(--surface); border-radius:var(--r); font-size:.82rem; font-weight:700; cursor:pointer; color:var(--text-muted);}
.mode-btn.active{background:var(--wheat-mid); color:#fff; border-color:var(--wheat-mid);}

.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:.9rem;}
.field label{display:block; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-light); margin-bottom:.35rem; font-family:var(--mono);}
.field input{width:100%; padding:9px 11px; border:1.5px solid var(--border-strong); border-radius:var(--r); font-size:.9rem; font-family:var(--mono);}

.toggle-option{display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-top:1px dashed var(--border); margin-top:.6rem;}
.toggle-option label{font-size:.82rem; font-weight:600; color:var(--text-muted);}
.toggle-option input[type=checkbox]{width:18px; height:18px;}

.resultat-box{background:var(--wheat-light); border-radius:var(--r); padding:1rem 1.1rem; margin-top:1.2rem;}
.resultat-ligne{display:flex; justify-content:space-between; font-size:.85rem; padding:3px 0;}
.resultat-ligne.total{font-weight:800; font-size:1rem; color:var(--wheat); border-top:1.5px solid var(--border-strong); margin-top:6px; padding-top:8px;}
.resultat-val{font-family:var(--mono); font-weight:700;}

.ingredients-recette{margin-top:1.3rem;}
.ingredients-recette table td{font-size:.85rem;}
.vide{text-align:center; padding:1.6rem; color:var(--text-light); font-size:.88rem;}

.overlay{display:none; position:fixed; inset:0; background:rgba(20,12,6,.55); align-items:center; justify-content:center; z-index:50; padding:1.2rem; overflow-y:auto;}
.overlay.visible{display:flex;}
.modale{background:var(--surface); border-radius:var(--r-lg); padding:1.5rem; width:100%; max-width:420px; box-shadow:0 20px 50px rgba(0,0,0,.3); margin:auto;}
.modale h3{color:var(--wheat); margin-bottom:1rem; font-size:1.05rem;}
.modale-actions{display:flex; gap:10px; margin-top:1.2rem;}
.modale-actions .btn{flex:1;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.field{margin-bottom:.9rem;}
.field select{width:100%; padding:9px 11px; border:1.5px solid var(--border-strong); border-radius:var(--r); font-size:.9rem; background:#fff;}
.msg-erreur-modale{display:none; background:var(--red-light); color:var(--red); padding:.55rem .75rem; border-radius:var(--r); font-size:.8rem; font-weight:600; margin-bottom:.8rem;}
.msg-erreur-modale.visible{display:block;}
</style>
</head>
<body>

<div class="topbar">
  <span class="marque"><a href="accueil.html" class="retour">←</a> 🌾 GESTION <span class="lock">🔒 gérant</span></span>
  <button class="deco" onclick="deconnexion()">Déconnexion</button>
</div>

<main>
  <div class="tabs">
    <button class="tab-btn active" data-tab="matieres" onclick="changerTab('matieres')" id="tab-matieres">Matières premières</button>
    <button class="tab-btn" data-tab="recettes" onclick="changerTab('recettes')">Recettes & marges</button>
  </div>

  <!-- ===== MATIÈRES PREMIÈRES ===== -->
  <div class="tab-panel active" id="panel-matieres">
    <div class="bar-actions">
      <button class="btn btn-primary btn-nouvelle" onclick="ouvrirModaleMP()">+ Nouvelle matière première</button>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Nom</th><th>Fournisseur</th><th>Prix HT/kg</th><th></th></tr></thead>
        <tbody id="corps-mp"><tr><td colspan="4" class="vide">Chargement…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- ===== RECETTES & GESTION ===== -->
  <div class="tab-panel" id="panel-recettes">
    <div class="bar-actions" style="justify-content:space-between;">
      <label style="display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--text-muted); cursor:pointer;">
        <input type="checkbox" id="cb-voir-desactivees" onchange="chargerListeRecettes()">
        Voir les recettes désactivées
      </label>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-ghost" style="width:auto;font-size:.8rem;padding:6px 10px;" onclick="exporterTarifs()">↓ Exporter tarifs</button>
        <button class="btn btn-primary btn-nouvelle" style="width:auto;" onclick="ouvrirModaleNouvelleRecette()">+ Nouvelle recette</button>
      </div>
    </div>
    <div class="fiche-recette">
      <div>
        <select id="filtre-metier" onchange="chargerListeRecettes()" style="width:100%; padding:8px 10px; margin-bottom:8px; border:1.5px solid var(--border-strong); border-radius:var(--r); font-size:.85rem; background:#fff; font-weight:600;">
          <option value="">Tous les métiers</option>
          <option value="B">Boulangerie</option>
          <option value="P">Pâtisserie</option>
          <option value="V">Viennoiserie</option>
          <option value="GV">Gâteaux de voyage</option>
          <option value="T">Traiteur</option>
        </select>
        <div class="card liste-recettes-nav" id="liste-recettes-nav">
          <div class="vide">Chargement…</div>
        </div>
      </div>

      <div class="card panneau-finance" id="panneau-finance">
        <div class="vide">Sélectionnez une recette à gauche.</div>
      </div>
    </div>
  </div>
</main>

<!-- Modale nouvelle recette -->
<div class="overlay" id="overlay-nouvelle-recette">
  <div class="modale">
    <h3>Nouvelle recette</h3>
    <div class="msg-erreur-modale" id="erreur-nouvelle-recette"></div>
    <div class="field"><label>Nom</label>
      <input type="text" id="nr-nom" style="width:100%; padding:9px 11px; border:1.5px solid var(--border-strong); border-radius:var(--r); font-size:.9rem;">
    </div>
    <div class="field"><label>Métier</label>
      <select id="nr-metier" style="width:100%; padding:9px 11px; border:1.5px solid var(--border-strong); border-radius:var(--r); background:#fff;">
        <option value="B">Boulangerie</option>
        <option value="P">Pâtisserie</option>
        <option value="V">Viennoiserie</option>
        <option value="GV">Gâteaux de voyage</option>
        <option value="T">Traiteur</option>
      </select>
    </div>
    <div class="row2">
      <div class="field"><label>Poids cru (g)</label>
        <input type="number" step="1" id="nr-poids-cru" style="width:100%; padding:9px 11px; border:1.5px solid var(--border-strong); border-radius:var(--r); font-family:var(--mono);">
      </div>
      <div class="field"><label>Poids cuit (g)</label>
        <input type="number" step="1" id="nr-poids-cuit" style="width:100%; padding:9px 11px; border:1.5px solid var(--border-strong); border-radius:var(--r); font-family:var(--mono);">
      </div>
    </div>
    <p class="note-prix-gerant" style="margin-bottom:1rem;">💡 Tu pourras ajouter les ingrédients juste après la création.</p>
    <div class="modale-actions">
      <button class="btn btn-ghost" onclick="fermerModaleNouvelleRecette()">Annuler</button>
      <button class="btn btn-primary" onclick="confirmerNouvelleRecette()">Créer</button>
    </div>
  </div>
</div>

<!-- Modale matière première -->
<div class="overlay" id="overlay-mp">
  <div class="modale">
    <h3>Nouvelle matière première</h3>
    <div class="msg-erreur-modale" id="erreur-mp"></div>
    <form onsubmit="return false;">
      <div class="field"><label>Nom</label><input type="text" id="mp-nom" required style="width:100%;padding:9px 11px;border:1.5px solid var(--border-strong);border-radius:var(--r);font-size:.9rem;"></div>
      <div class="row2">
        <div class="field"><label>Fournisseur</label><input type="text" id="mp-fournisseur" style="width:100%;padding:9px 11px;border:1.5px solid var(--border-strong);border-radius:var(--r);font-size:.9rem;"></div>
        <div class="field"><label>Prix HT / kg (€)</label><input type="number" step="0.0001" id="mp-prix" required style="width:100%;padding:9px 11px;border:1.5px solid var(--border-strong);border-radius:var(--r);font-size:.9rem;font-family:var(--mono);"></div>
      </div>
      <div class="field" style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="mp-bio" style="width:18px;height:18px;">
        <label style="margin:0;">Matière première biologique</label>
      </div>
    </form>
    <div class="modale-actions">
      <button class="btn btn-ghost" onclick="fermerModaleMP()">Annuler</button>
      <button class="btn btn-primary" onclick="confirmerMP()">Ajouter</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script>
let profilCourant = null;
let recetteSelectionneeId = null;
let prixFarineT110 = 0;
let prixFarineEngrain = 0;
let prixEau = 0;
let cacheCoutRecetteSource = {}; // recette_id -> coût total HT (évite de re-demander)

// Miroir JS de la fonction SQL get_cout_levain() — évite un aller-retour
// réseau par ligne. Règles fixes : levain dur/liquide -> Farine T110 Bio,
// levain engrain -> Farine T110 Engrain Bio. Ratios : dur 2:1, liquide 1:1.
//
// Gère aussi les lignes "recette_source" (ex: "Pâte Odette (propre)" dans
// Odette aux Graines) : le coût est alors résolu via la fonction serveur
// get_cout_total_recette(), ramené au prorata de la quantité utilisée.
async function coutLigneIngredient(ingredient) {
  const { nom_affiche: nomMatiere, quantite_base_g: quantiteG, matieres_premieres, recette_source_id } = ingredient;
  const prixHtKg = matieres_premieres?.prix_ht_kg;

  if (recette_source_id) {
    if (!(recette_source_id in cacheCoutRecetteSource)) {
      const [{ data: coutTotal }, { data: ingredientsSource }] = await Promise.all([
        sb.rpc('get_cout_total_recette', { p_recette_id: recette_source_id }),
        sb.from('recette_ingredients').select('quantite_base_g').eq('recette_id', recette_source_id)
      ]);
      const baseSource = (ingredientsSource || []).reduce((s, i) => s + Number(i.quantite_base_g), 0);
      cacheCoutRecetteSource[recette_source_id] = { coutTotal: coutTotal || 0, baseSource };
    }
    const { coutTotal, baseSource } = cacheCoutRecetteSource[recette_source_id];
    return baseSource > 0 ? (quantiteG / baseSource) * coutTotal : 0;
  }

  if (nomMatiere === 'Levain liquide') {
    const eauG = quantiteG * 0.5, farineG = quantiteG - eauG;
    return (farineG / 1000) * prixFarineT110 + (eauG / 1000) * prixEau;
  }
  if (nomMatiere === 'Levain dur') {
    const eauG = quantiteG * (1 / 3), farineG = quantiteG - eauG;
    return (farineG / 1000) * prixFarineT110 + (eauG / 1000) * prixEau;
  }
  if (nomMatiere === 'Levain liquide Engrain') {
    const eauG = quantiteG * 0.5, farineG = quantiteG - eauG;
    return (farineG / 1000) * prixFarineEngrain + (eauG / 1000) * prixEau;
  }
  return (quantiteG / 1000) * (prixHtKg || 0);
}

async function chargerPrixReference() {
  const { data } = await sb.from('matieres_premieres')
    .select('nom, prix_ht_kg')
    .in('nom', ['Farine T110 Bio', 'Farine T110 Engrain Bio', 'Eau']);
  (data || []).forEach(mp => {
    if (mp.nom === 'Farine T110 Bio') prixFarineT110 = mp.prix_ht_kg;
    if (mp.nom === 'Farine T110 Engrain Bio') prixFarineEngrain = mp.prix_ht_kg;
    if (mp.nom === 'Eau') prixEau = mp.prix_ht_kg;
  });
}

function changerTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
}

// ---------------- MATIÈRES PREMIÈRES ----------------
const labelsCategorieMp = {
  farines: 'Farines', levains_ferments: 'Levains & ferments',
  sel_sucres_epices: 'Sel, sucres et épices', matieres_grasses: 'Matières grasses',
  liquides_oeufs: 'Liquides et œufs', graines_fruits_secs: 'Graines et fruits secs',
  fruits_legumes: 'Fruits & légumes', chocolat_cacao: 'Chocolat & cacao',
  emballage_consommables: 'Emballage & consommables', autres_preparations: 'Autres / Préparations',
  viandes_fromages: 'Viandes & Fromages'
};

async function chargerMP() {
  const { data, error } = await sb.from('matieres_premieres').select('*').order('categorie').order('nom');
  const corps = document.getElementById('corps-mp');
  if (error) { corps.innerHTML = `<tr><td colspan="4" class="vide">Erreur : ${error.message}</td></tr>`; return; }
  if (!data || data.length === 0) { corps.innerHTML = '<tr><td colspan="4" class="vide">Aucune matière première.</td></tr>'; return; }

  let html = '';
  let categorieCourante = undefined;
  data.forEach(mp => {
    if (mp.categorie !== categorieCourante) {
      categorieCourante = mp.categorie;
      const label = labelsCategorieMp[categorieCourante] || 'Sans catégorie';
      html += `<tr><td colspan="4" style="background:var(--surface2); font-size:.7rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--text-light); font-family:var(--mono);">${label}</td></tr>`;
    }
    html += `
      <tr>
        <td>${mp.nom}${mp.bio ? '<span class="bio-tag">BIO</span>' : ''}</td>
        <td>${mp.fournisseur || '—'}</td>
        <td>
          <input type="number" step="0.0001" class="input-mini" value="${mp.prix_ht_kg}"
                 onchange="majPrixMP('${mp.id}', this.value)">
        </td>
        <td style="display:flex;gap:4px;">
          <button class="btn-icon" title="Éditer" onclick='ouvrirModaleEditionMP(${JSON.stringify(mp).replace(/'/g,"&apos;")})'>✏️</button>
          <button class="btn-icon" onclick="supprimerMP('${mp.id}')">🗑️</button>
        </td>
      </tr>`;
  });
  corps.innerHTML = html;
}

async function majPrixMP(id, valeur) {
  const prix = parseFloat(valeur);
  if (isNaN(prix) || prix < 0) return;
  const { error } = await sb.from('matieres_premieres').update({ prix_ht_kg: prix }).eq('id', id);
  if (error) alert('Erreur : ' + error.message);
  else if (recetteSelectionneeId) await chargerFicheRecette(recetteSelectionneeId);
}

async function supprimerMP(id) {
  if (!confirm('Supprimer cette matière première ? Impossible si elle est utilisée dans une recette.')) return;
  const { error } = await sb.from('matieres_premieres').delete().eq('id', id);
  if (error) { alert('Erreur : ' + error.message); return; }
  await chargerMP();
}

function ouvrirModaleEditionMP(mp) {
  document.getElementById('erreur-edition-mp').classList.remove('visible');
  document.getElementById('edit-mp-id').value = mp.id;
  document.getElementById('edit-mp-nom').value = mp.nom || '';
  document.getElementById('edit-mp-fournisseur').value = mp.fournisseur || '';
  document.getElementById('edit-mp-categorie').value = mp.categorie || '';
  document.getElementById('edit-mp-bio').checked = mp.bio || false;
  const metiers = mp.metiers || [];
  document.getElementById('edit-mp-b').checked = metiers.includes('B');
  document.getElementById('edit-mp-p').checked = metiers.includes('P');
  document.getElementById('edit-mp-v').checked = metiers.includes('V');
  document.getElementById('edit-mp-gv').checked = metiers.includes('GV');
  document.getElementById('edit-mp-t').checked = metiers.includes('T');
  document.getElementById('overlay-edition-mp').classList.add('visible');
}

function fermerModaleEditionMP() {
  document.getElementById('overlay-edition-mp').classList.remove('visible');
}

async function confirmerEditionMP() {
  const id = document.getElementById('edit-mp-id').value;
  const nom = document.getElementById('edit-mp-nom').value.trim();
  const fournisseur = document.getElementById('edit-mp-fournisseur').value.trim();
  const categorie = document.getElementById('edit-mp-categorie').value || null;
  const bio = document.getElementById('edit-mp-bio').checked;
  const erreur = document.getElementById('erreur-edition-mp');

  const metiers = [];
  if (document.getElementById('edit-mp-b').checked) metiers.push('B');
  if (document.getElementById('edit-mp-p').checked) metiers.push('P');
  if (document.getElementById('edit-mp-v').checked) metiers.push('V');
  if (document.getElementById('edit-mp-gv').checked) metiers.push('GV');
  if (document.getElementById('edit-mp-t').checked) metiers.push('T');

  if (!nom) { erreur.textContent = 'Le nom est obligatoire.'; erreur.classList.add('visible'); return; }

  const { error } = await sb.from('matieres_premieres').update({
    nom, fournisseur, categorie, bio, metiers
  }).eq('id', id);

  if (error) { erreur.textContent = error.message; erreur.classList.add('visible'); return; }

  fermerModaleEditionMP();
  await chargerMP();
  // Rechargement de la fiche recette si une est ouverte (le nom de la MP
  // peut y être affiché — on rafraîchit pour éviter un affichage obsolète)
  if (recetteSelectionneeId) await chargerFicheRecette(recetteSelectionneeId);
}

function ouvrirModaleMP() {
  document.getElementById('erreur-mp').classList.remove('visible');
  document.getElementById('mp-nom').value = '';
  document.getElementById('mp-fournisseur').value = '';
  document.getElementById('mp-prix').value = '';
  document.getElementById('mp-bio').checked = false;
  document.getElementById('overlay-mp').classList.add('visible');
}
function fermerModaleMP() { document.getElementById('overlay-mp').classList.remove('visible'); }

async function confirmerMP() {
  const nom = document.getElementById('mp-nom').value.trim();
  const fournisseur = document.getElementById('mp-fournisseur').value.trim();
  const prix = parseFloat(document.getElementById('mp-prix').value);
  const bio = document.getElementById('mp-bio').checked;
  const erreur = document.getElementById('erreur-mp');

  if (!nom || isNaN(prix)) {
    erreur.textContent = 'Le nom et le prix sont obligatoires.';
    erreur.classList.add('visible');
    return;
  }

  const { error } = await sb.from('matieres_premieres').insert({ nom, fournisseur, prix_ht_kg: prix, bio });
  if (error) { erreur.textContent = error.message; erreur.classList.add('visible'); return; }

  fermerModaleMP();
  await chargerMP();
}

// ---------------- RECETTES & FINANCE ----------------
async function chargerListeRecettes() {
  const voirDesactivees = document.getElementById('cb-voir-desactivees')?.checked;
  const metierFiltre = document.getElementById('filtre-metier')?.value;

  let requete = sb.from('recettes').select('id, nom, metier, actif').order('metier').order('nom');
  if (!voirDesactivees) requete = requete.eq('actif', true);
  if (metierFiltre) requete = requete.eq('metier', metierFiltre);

  const { data, error } = await requete;
  const conteneur = document.getElementById('liste-recettes-nav');
  if (error) { conteneur.innerHTML = `<div class="vide">Erreur : ${error.message}</div>`; return; }
  if (!data || data.length === 0) { conteneur.innerHTML = '<div class="vide">Aucune recette pour ce filtre.</div>'; return; }

  const labelsMetier = { B: 'Boulangerie', P: 'Pâtisserie', V: 'Viennoiserie', GV: 'Gâteaux de voyage', T: 'Traiteur' };

  // Si aucun filtre métier n'est actif, on regroupe visuellement par
  // métier pour faciliter le repérage dans une liste longue.
  if (!metierFiltre) {
    let html = '';
    let metierCourant = null;
    data.forEach(r => {
      if (r.metier !== metierCourant) {
        metierCourant = r.metier;
        html += `<div style="padding:7px 14px; font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--text-light); background:var(--surface2); font-family:var(--mono);">${labelsMetier[r.metier] || r.metier}</div>`;
      }
      html += `
        <div class="recette-nav-item ${r.id === recetteSelectionneeId ? 'active' : ''} ${!r.actif ? 'desactivee' : ''}" onclick="chargerFicheRecette('${r.id}')">
          ${r.nom}${!r.actif ? ' <span style="font-size:.7rem; opacity:.6;">(désactivée)</span>' : ''}
        </div>`;
    });
    conteneur.innerHTML = html;
  } else {
    conteneur.innerHTML = data.map(r => `
      <div class="recette-nav-item ${r.id === recetteSelectionneeId ? 'active' : ''} ${!r.actif ? 'desactivee' : ''}" onclick="chargerFicheRecette('${r.id}')">
        ${r.nom}${!r.actif ? ' <span style="font-size:.7rem; opacity:.6;">(désactivée)</span>' : ''}
      </div>
    `).join('');
  }
}

function ouvrirModaleNouvelleRecette() {
  document.getElementById('erreur-nouvelle-recette').classList.remove('visible');
  document.getElementById('nr-nom').value = '';
  document.getElementById('nr-metier').value = 'B';
  document.getElementById('nr-poids-cru').value = '';
  document.getElementById('nr-poids-cuit').value = '';
  document.getElementById('overlay-nouvelle-recette').classList.add('visible');
}
function fermerModaleNouvelleRecette() {
  document.getElementById('overlay-nouvelle-recette').classList.remove('visible');
}

async function confirmerNouvelleRecette() {
  const nom = document.getElementById('nr-nom').value.trim();
  const metier = document.getElementById('nr-metier').value;
  const poidsCru = parseFloat(document.getElementById('nr-poids-cru').value) || null;
  const poidsCuit = parseFloat(document.getElementById('nr-poids-cuit').value) || null;
  const erreur = document.getElementById('erreur-nouvelle-recette');

  if (!nom) { erreur.textContent = 'Le nom est obligatoire.'; erreur.classList.add('visible'); return; }

  const { data, error } = await sb.from('recettes').insert({
    nom, metier, poids_piece_g: poidsCru, poids_cuit_g: poidsCuit
  }).select().single();
  if (error) { erreur.textContent = error.message; erreur.classList.add('visible'); return; }

  await sb.from('recette_finance').insert({ recette_id: data.id, coefficient: 3.5, marge_pct: 70, tva_pct: 10 });

  fermerModaleNouvelleRecette();
  await chargerListeRecettes();
  await chargerFicheRecette(data.id);
}

async function desactiverRecette() {
  if (!confirm('Désactiver cette recette ? Elle ne sera plus utilisable pour de nouvelles productions, mais son historique reste conservé.')) return;
  await sb.from('recettes').update({ actif: false }).eq('id', recetteSelectionneeId);
  await chargerListeRecettes();
  document.getElementById('panneau-finance').innerHTML = '<div class="vide">Recette désactivée. Sélectionnez-en une autre.</div>';
  recetteSelectionneeId = null;
}

async function reactiverRecette() {
  await sb.from('recettes').update({ actif: true }).eq('id', recetteSelectionneeId);
  await chargerListeRecettes();
  await chargerFicheRecette(recetteSelectionneeId);
}

function calculerResultat(coutTotalMP, poidsTotalIngredients, financeActuelle) {
  const perte = parseFloat(document.getElementById('finance-perte')?.value || 0);
  const emballage = parseFloat(document.getElementById('finance-emballage')?.value || 0);
  const tvaPct = parseFloat(document.getElementById('finance-tva')?.value || 0);
  const tva = 1 + tvaPct / 100;
  const coef = parseFloat(document.getElementById('finance-coefficient')?.value || financeActuelle.coefficient);
  const margePct = parseFloat(document.getElementById('finance-marge')?.value || financeActuelle.marge_pct);
  const poidsCru = parseFloat(document.getElementById('finance-poids')?.value || 0) || poidsTotalIngredients || 0;
  const poidsCuit = parseFloat(document.getElementById('finance-poids-cuit')?.value || 0) || poidsCru || 0;

  // Mode à la part : ramener le coût au poids d'une part cuite
  const modePart = document.getElementById('finance-mode-part')?.checked || false;
  const poidsPart = parseFloat(document.getElementById('finance-poids-part')?.value || 0);
  const emballagePart = parseFloat(document.getElementById('finance-emballage-part')?.value || 0);

  let coutBaseHT = coutTotalMP;
  if (poidsTotalIngredients > 0 && poidsCru > 0) {
    coutBaseHT = (coutTotalMP / poidsTotalIngredients) * poidsCru;
  }

  // Si mode à la part : ramener le coût au poids de la part cuite
  // Le ratio se fait sur le poids cuit : poids_part / poids_cuit_tournée
  let coutUnitaire = coutBaseHT;
  let emballageEffectif = emballage;
  let poidsCalc = poidsCuit > 0 ? poidsCuit : poidsCru;

  if (modePart && poidsPart > 0 && poidsCalc > 0) {
    const ratioPart = poidsPart / poidsCalc;
    coutUnitaire = coutBaseHT * ratioPart;
    emballageEffectif = emballagePart; // emballage par part, pas par tournée
    poidsCalc = poidsPart;
  }

  const facteurPerte = perte > 0 ? 1 + perte / 100 : 1;
  const coutAvecPerteHT = coutUnitaire * facteurPerte;

  const prixMagCoefHT = (coutUnitaire * facteurPerte * coef) + emballageEffectif;
  const prixMagMargeHT = margePct >= 100 ? 0 : (coutUnitaire * facteurPerte / (1 - margePct / 100)) + emballageEffectif;
  const prixMagCoefTTC = prixMagCoefHT * tva;
  const prixMagMargeTTC = prixMagMargeHT * tva;

  const prixVenteTtc = (prixMagCoefTTC + prixMagMargeTTC) / 2;
  const prixVenteHt = (prixMagCoefHT + prixMagMargeHT) / 2;

  const poidsRef = poidsCalc;
  const prixKiloTtc = poidsRef > 0 ? (prixVenteTtc / poidsRef) * 1000 : 0;
  const coutMatiereKiloHt = poidsRef > 0 ? (coutAvecPerteHT / poidsRef) * 1000 : 0;
  const avertissementPoids = modePart && poidsPart > 0 ? '' :
    (!document.getElementById('finance-poids-cuit')?.value) && poidsCru > 0
      ? '<div class="resultat-ligne" style="color:var(--text-light);font-size:.75rem;">⚠ Poids cuit non renseigné — calcul basé sur le poids cru</div>'
      : '';

  // Ligne info mode à la part
  const infoModePart = modePart && poidsPart > 0
    ? `<div class="resultat-ligne" style="color:#2d6a4f;font-size:.8rem;">🍰 Calcul sur la part de ${poidsPart}g (tournée : ${poidsCuit || poidsCru}g)</div>`
    : '';

  const canal = document.getElementById('finance-sim-canal')?.value || 'boutique';
  const estPro = canal === 'pro' || canal === 'traiteur';

  let htmlResultat = `
    ${infoModePart}
    <div class="resultat-ligne"><span>Coût matière ${modePart && poidsPart > 0 ? 'par part' : '(poids fiche)'}</span><span class="resultat-val">${(modePart && poidsPart > 0 ? coutUnitaire : coutTotalMP).toFixed(4)} €</span></div>
    <div class="resultat-ligne"><span>Coût + perte</span><span class="resultat-val">${coutAvecPerteHT.toFixed(4)} €</span></div>
    <div class="resultat-ligne"><span>Coût matière (€/kg)</span><span class="resultat-val">${coutMatiereKiloHt.toFixed(3)} €/kg</span></div>`;

  if (estPro) {
    // Calculateur bi-directionnel pro
    const margeDistrib = parseFloat(document.getElementById('finance-marge-distrib')?.value || 35);
    const prixRayon = parseFloat(document.getElementById('finance-prix-rayon')?.value || 0);
    const tvaRayon = tvaPct / 100 + 1;

    // Plancher : coût → prix mini HT
    const prixPlancher = margePct < 100 ? coutAvecPerteHT / (1 - margePct / 100) + emballage : 0;

    // Plafond : prix rayon → prix maxi HT
    const prixPlafond = prixRayon > 0 ? (prixRayon / tvaRayon) * (1 - margeDistrib / 100) : 0;

    // Optimum = milieu de la zone si elle existe
    const zoneOk = prixPlafond > 0 && prixPlafond >= prixPlancher;
    const prixOptimal = zoneOk ? (prixPlancher + prixPlafond) / 2 : prixPlancher;
    const margeReelle = prixOptimal > 0 ? ((prixOptimal - emballage - coutAvecPerteHT) / prixOptimal) * 100 : 0;
    const prixRayonEstime = prixOptimal * tvaRayon / (1 - margeDistrib / 100);

    htmlResultat += `
      <div style="margin-top:14px;padding:12px;background:#f8f9fa;border-radius:var(--r);border:1.5px solid var(--border-strong);">
        <div style="font-weight:700;font-size:.85rem;margin-bottom:10px;color:var(--wheat);">🎯 Calculateur prix optimal Pro</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
          <div style="padding:10px;background:#fff;border-radius:var(--r);border:1px solid var(--border);">
            <div style="font-size:.72rem;text-transform:uppercase;color:var(--text-light);margin-bottom:6px;">Mon plancher</div>
            <div style="font-size:.8rem;color:var(--text-light);">Marge cible</div>
            <div style="font-size:.8rem;color:var(--text-light);">→ Prix mini HT</div>
            <div style="font-size:1.1rem;font-weight:800;color:#e53e3e;font-family:var(--mono);">${prixPlancher.toFixed(2)} €</div>
          </div>
          <div style="padding:10px;background:#fff;border-radius:var(--r);border:1px solid var(--border);">
            <div style="font-size:.72rem;text-transform:uppercase;color:var(--text-light);margin-bottom:4px;">Prix marché</div>
            <div style="display:flex;align-items:center;gap:4px;margin-bottom:4px;">
              <span style="font-size:.75rem;">Rayon TTC</span>
              <input type="number" step="0.10" id="finance-prix-rayon" value="${prixRayon || ''}" placeholder="4.50" style="width:70px;padding:3px 6px;border:1px solid var(--border-strong);border-radius:4px;font-size:.8rem;font-family:var(--mono);" oninput="recalculerEtEnregistrer(false)">
            </div>
            <div style="display:flex;align-items:center;gap:4px;">
              <span style="font-size:.75rem;">Marge distrib %</span>
              <input type="number" step="1" id="finance-marge-distrib" value="${margeDistrib}" style="width:55px;padding:3px 6px;border:1px solid var(--border-strong);border-radius:4px;font-size:.8rem;font-family:var(--mono);" oninput="recalculerEtEnregistrer(false)">
            </div>
            ${prixPlafond > 0 ? `<div style="font-size:1.1rem;font-weight:800;color:#2d6a4f;font-family:var(--mono);margin-top:4px;">→ ${prixPlafond.toFixed(2)} € maxi</div>` : '<div style="font-size:.75rem;color:var(--text-light);margin-top:4px;">Renseigner un prix rayon</div>'}
          </div>
        </div>
        ${zoneOk ? `
        <div style="padding:12px;background:#e6f4ea;border-radius:var(--r);border:1.5px solid #2d6a4f;text-align:center;">
          <div style="font-size:.72rem;text-transform:uppercase;color:#2d6a4f;margin-bottom:6px;">✅ Zone d'optimum</div>
          <div style="font-size:1.4rem;font-weight:900;color:#2d6a4f;font-family:var(--mono);">${prixOptimal.toFixed(2)} € HT</div>
          <div style="font-size:.8rem;color:#2d6a4f;margin-top:4px;">Marge réelle : ${margeReelle.toFixed(1)}% · Prix rayon estimé : ${prixRayonEstime.toFixed(2)} € TTC</div>
        </div>` : `
        <div style="padding:12px;background:#fff5f5;border-radius:var(--r);border:1.5px solid #e53e3e;text-align:center;">
          <div style="font-size:.8rem;color:#e53e3e;">⚠️ ${prixPlafond > 0 ? 'Marge cible incompatible avec le prix marché — le prix plancher dépasse le prix plafond' : 'Renseigner un prix rayon pour voir la zone d\'optimum'}</div>
          <div style="font-size:1.2rem;font-weight:800;color:#e53e3e;font-family:var(--mono);margin-top:6px;">${prixPlancher.toFixed(2)} € HT minimum</div>
          <div style="font-size:.78rem;color:var(--text-light);margin-top:2px;">Prix rayon estimé : ${(prixPlancher * tvaRayon / (1 - margeDistrib/100)).toFixed(2)} € TTC</div>
        </div>`}
      </div>`;
  } else {
    htmlResultat += `
    <div class="resultat-ligne"><span>Méthode Coef — TTC</span><span class="resultat-val">${prixMagCoefTTC.toFixed(2)} €</span></div>
    <div class="resultat-ligne"><span>Méthode Marge — TTC</span><span class="resultat-val">${prixMagMargeTTC.toFixed(2)} €</span></div>
    <div class="resultat-ligne total"><span>Prix de vente TTC (moyenne)</span><span class="resultat-val">${prixVenteTtc.toFixed(2)} €</span></div>
    <div class="resultat-ligne total"><span>Prix de vente TTC (€/kg)</span><span class="resultat-val">${prixKiloTtc.toFixed(2)} €/kg</span></div>
    ${avertissementPoids}`;
  }

  document.getElementById('resultat-box').innerHTML = htmlResultat;

  return { coutMpHt: coutAvecPerteHT + emballage, prixVenteHt, prixVenteTtc };
}

async function recalculerEtEnregistrer(enregistrer = true) {
  const { data: ingredients } = await sb
    .from('recette_ingredients')
    .select('quantite_base_g, mp_id, nom_affiche, recette_source_id, matieres_premieres(prix_ht_kg)')
    .eq('recette_id', recetteSelectionneeId);

  const coutsParLigne = await Promise.all((ingredients || []).map(i => coutLigneIngredient(i)));
  const coutTotalMP = coutsParLigne.reduce((s, c) => s + c, 0);
  const poidsTotalIngredients = (ingredients || []).reduce((s, i) => s + (i.quantite_base_g || 0), 0);

  const coefficient = parseFloat(document.getElementById('finance-coefficient')?.value || 3.5);
  const margePct = parseFloat(document.getElementById('finance-marge')?.value || 70);
  const tvaPct = parseFloat(document.getElementById('finance-tva')?.value || 10);
  const poidsPiece = parseFloat(document.getElementById('finance-poids')?.value || 0);
  const poidsCuit = parseFloat(document.getElementById('finance-poids-cuit')?.value || 0);
  const tauxPerte = parseFloat(document.getElementById('finance-perte')?.value || 0);
  const emballage = parseFloat(document.getElementById('finance-emballage')?.value || 0);

  const resultat = calculerResultat(coutTotalMP, poidsTotalIngredients, { coefficient, marge_pct: margePct });

  if (enregistrer) {
    const nom = document.getElementById('finance-nom-recette')?.value.trim();
    const metier = document.getElementById('finance-metier')?.value;
    const famille = document.getElementById('finance-famille')?.value || null;

    await sb.from('recettes').update({
      nom, metier, famille,
      poids_piece_g: poidsPiece, poids_cuit_g: poidsCuit || null
    }).eq('id', recetteSelectionneeId);

    const simId = document.getElementById('finance-sim-id')?.value;
    const simLabel = document.getElementById('finance-sim-label')?.value.trim() || 'Boutique';
    const simCanal = document.getElementById('finance-sim-canal')?.value || 'boutique';
    const modePart = document.getElementById('finance-mode-part')?.checked || false;
    const poidsPart = parseFloat(document.getElementById('finance-poids-part')?.value || 0) || null;
    const emballagePart = parseFloat(document.getElementById('finance-emballage-part')?.value || 0);

    await sb.from('recette_finance').update({
      coefficient, marge_pct: margePct, tva_pct: tvaPct,
      taux_perte_pct: tauxPerte, prix_emballage_ht: emballage,
      cout_mp_ht: resultat.coutMpHt, prix_vente_ttc: resultat.prixVenteTtc,
      label: simLabel, canal: simCanal,
      mode_part: modePart, poids_part_g: poidsPart, emballage_part_ht: emballagePart,
      updated_at: new Date().toISOString()
    }).eq('id', simId);

    // Mettre à jour le label dans le select
    const select = document.getElementById('finance-simulation-select');
    if (select) {
      const opt = select.querySelector(`option[value="${simId}"]`);
      if (opt) opt.textContent = simLabel + (simCanal === 'pro' ? ' (Pro HT)' : simCanal === 'marche' ? ' (Marché)' : '');
    }

    await chargerListeRecettes();
  }
}

function toggleModePart() {
  const checked = document.getElementById('finance-mode-part')?.checked;
  document.getElementById('zone-mode-part').style.display = checked ? 'block' : 'none';
}

async function changerSimulation(simId) {
  const { data: finance } = await sb.from('recette_finance').select('*').eq('id', simId).single();
  if (!finance) return;

  document.getElementById('finance-sim-id').value = finance.id;
  document.getElementById('finance-sim-label').value = finance.label || 'Boutique';
  document.getElementById('finance-sim-canal').value = finance.canal || 'boutique';
  document.getElementById('finance-coefficient').value = finance.coefficient || 3.5;
  document.getElementById('finance-marge').value = finance.marge_pct || 70;
  document.getElementById('finance-tva').value = finance.tva_pct || 10;
  document.getElementById('finance-perte').value = finance.taux_perte_pct || 0;
  document.getElementById('finance-emballage').value = finance.prix_emballage_ht || 0;
  document.getElementById('finance-mode-part').checked = finance.mode_part || false;
  document.getElementById('finance-poids-part').value = finance.poids_part_g || '';
  document.getElementById('finance-emballage-part').value = finance.emballage_part_ht || 0;
  toggleModePart();

  // Mettre à jour le bouton supprimer
  const { data: toutes } = await sb.from('recette_finance').select('id').eq('recette_id', recetteSelectionneeId).eq('actif', true);
  document.querySelector('[onclick^="supprimerSimulation"]')?.setAttribute('onclick', `supprimerSimulation('${simId}')`);
  document.querySelector('[onclick^="supprimerSimulation"]').disabled = (toutes?.length || 1) <= 1;

  await recalculerEtEnregistrer(false);
}

async function dupliquerSimulation(simId) {
  console.log('[dupliquer] simId reçu:', simId);
  if (!simId) {
    alert('Erreur : aucune simulation sélectionnée (simId vide)');
    return;
  }

  const { data: source, error: errSource } = await sb.from('recette_finance').select('*').eq('id', simId).single();
  console.log('[dupliquer] source:', source, 'erreur:', errSource);
  if (!source) {
    alert('Erreur lecture source : ' + (errSource?.message || 'inconnu'));
    return;
  }

  const payload = {
    recette_id: source.recette_id,
    coefficient: source.coefficient,
    marge_pct: source.marge_pct,
    tva_pct: source.tva_pct,
    prix_emballage_ht: source.prix_emballage_ht,
    taux_perte_pct: source.taux_perte_pct,
    label: (source.label || 'Boutique') + ' (copie)',
    canal: source.canal || 'boutique',
    poids_vente_g: source.poids_vente_g,
    mode_part: source.mode_part,
    poids_part_g: source.poids_part_g,
    emballage_part_ht: source.emballage_part_ht,
    actif: true
  };
  console.log('[dupliquer] payload insert:', payload);

  const { data: nouvelle, error: errInsert } = await sb.from('recette_finance').insert(payload).select().single();
  console.log('[dupliquer] nouvelle:', nouvelle, 'erreur insert:', errInsert);

  if (errInsert) {
    alert('Erreur duplication : ' + errInsert.message);
    return;
  }

  if (nouvelle) {
    const select = document.getElementById('finance-simulation-select');
    const opt = document.createElement('option');
    opt.value = nouvelle.id;
    opt.textContent = nouvelle.label;
    select.appendChild(opt);
    select.value = nouvelle.id;
    changerSimulation(nouvelle.id);
  }
}

async function supprimerSimulation(simId) {
  if (!confirm('Supprimer cette simulation ?')) return;
  await sb.from('recette_finance').update({ actif: false }).eq('id', simId);
  // Recharger la fiche
  chargerFicheRecette(recetteSelectionneeId);
}

function basculerOnglet(onglet, btn) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('onglet-finance').style.display = onglet === 'finance' ? '' : 'none';
  document.getElementById('onglet-ingredients').style.display = onglet === 'ingredients' ? '' : 'none';
}

async function modifierQuantiteIngredient(ligneId, valeur) {
  const qte = parseFloat(valeur);
  if (isNaN(qte) || qte < 0) return;
  const { error } = await sb.from('recette_ingredients').update({ quantite_base_g: qte }).eq('id', ligneId);
  if (error) { alert('Erreur : ' + error.message); return; }
  await chargerFicheRecette(recetteSelectionneeId);
  // Reste sur l'onglet ingrédients après rafraîchissement
  basculerOnglet('ingredients', document.querySelectorAll('.mode-btn')[1]);
}

async function supprimerIngredient(ligneId) {
  if (!confirm('Supprimer cet ingrédient de la recette ?')) return;
  const { error } = await sb.from('recette_ingredients').delete().eq('id', ligneId);
  if (error) { alert('Erreur : ' + error.message); return; }
  await chargerFicheRecette(recetteSelectionneeId);
  basculerOnglet('ingredients', document.querySelectorAll('.mode-btn')[1]);
}

let toutesMatieresPourAjout = [];

function genererOptionsMpParCategorie(matieres) {
  const groupes = {};
  matieres.forEach(mp => {
    const cle = labelsCategorieMp[mp.categorie] || 'Sans catégorie';
    (groupes[cle] = groupes[cle] || []).push(mp);
  });
  return Object.entries(groupes).map(([cat, mps]) => `
    <optgroup label="${cat}">
      ${mps.map(mp => `<option value="${mp.id}">${mp.nom}</option>`).join('')}
    </optgroup>
  `).join('');
}

    toutesMatieresPourAjout = data || [];

  const optionsHtml = genererOptionsMpParCategorie(toutesMatieresPourAjout);

      </div>

        <button class="btn btn-primary" onclick="confirmerAjoutIngredient()">Ajouter</button>
      </div>
    </div>`;

async function confirmerAjoutIngredient() {
  const mpId = document.getElementById('ai-mp').value;
  const qte = parseFloat(document.getElementById('ai-qte').value);
  const mp = toutesMatieresPourAjout.find(m => m.id === mpId);
  if (!mpId || isNaN(qte) || qte <= 0) { alert('Renseignez une matière et une quantité valide.'); return; }

  const { data: maxOrdre } = await sb.from('recette_ingredients').select('ordre').eq('recette_id', recetteSelectionneeId).order('ordre', { ascending: false }).limit(1).maybeSingle();

  const { error } = await sb.from('recette_ingredients').insert({
    recette_id: recetteSelectionneeId, mp_id: mpId, nom_affiche: mp.nom,
    quantite_base_g: qte, ordre: (maxOrdre?.ordre || 0) + 1
  });
  if (error) { alert('Erreur : ' + error.message); return; }

  document.getElementById('overlay-ajout-ingredient')?.remove();
  await chargerFicheRecette(recetteSelectionneeId);
  basculerOnglet('ingredients', document.querySelectorAll('.mode-btn')[1]);
}

async function exporterTarifs() {
  // Charger toutes les recettes actives
  const { data: recettes } = await sb.from('recettes')
    .select('id, nom, metier, famille')
    .eq('actif', true)
    .order('metier').order('nom');

  // Charger toutes les simulations actives
  const { data: finances } = await sb.from('recette_finance')
    .select('recette_id, label, canal, prix_vente_ttc, tva_pct')
    .neq('actif', false);

  if (!recettes || !finances) { alert('Erreur lors du chargement des données'); return; }

  // Indexer par recette_id -> liste de simulations
  const financeParRecette = {};
  finances.forEach(f => {
    if (!financeParRecette[f.recette_id]) financeParRecette[f.recette_id] = [];
    financeParRecette[f.recette_id].push(f);
  });

  const labelsMetier = { B: 'Boulangerie', V: 'Viennoiserie', GV: 'Gâteaux de voyage', P: 'Pâtisserie', T: 'Traiteur' };

  // Construire le CSV
  const lignes = [['Recette', 'Métier', 'Prix vente TTC boutique (€)', 'Prix vente HT pro (€)']];

  recettes.forEach(r => {
    const sims = financeParRecette[r.id] || [];

    // Boutique : canal = 'boutique' ou 'marche' → prix_vente_ttc
    const boutique = sims.find(f => f.canal === 'boutique' || f.canal === 'marche');
    const prixBoutiqueTtc = boutique?.prix_vente_ttc != null
      ? boutique.prix_vente_ttc.toFixed(2).replace('.', ',')
      : '';

    // Pro : canal = 'pro' → prix_vente_ttc est en réalité le prix HT
    const pro = sims.find(f => f.canal === 'pro');
    const prixProHt = pro?.prix_vente_ttc != null
      ? pro.prix_vente_ttc.toFixed(2).replace('.', ',')
      : '';

    lignes.push([
      r.nom,
      labelsMetier[r.metier] || r.metier,
      prixBoutiqueTtc,
      prixProHt
    ]);
  });

  const csvContent = lignes.map(row => row.map(cell => `"${cell}"`).join(';')).join('\n');
  const bom = '﻿'; // BOM UTF-8 pour Excel
  const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `tarifs-pain-nature-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
