<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pain Nature — Import PDF</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#546054">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<style>
.topbar{background:#546054;color:#fff;padding:0 1.2rem;height:54px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.2);position:sticky;top:0;z-index:10;}
.topbar .marque{font-weight:800;font-size:1rem;display:flex;align-items:center;gap:.6rem;}
.topbar .retour{color:#fff;text-decoration:none;font-size:1.3rem;opacity:.85;}
main{max-width:700px;margin:1.2rem auto 4rem;padding:0 1.2rem;}

/* Choix du mode */
.mode-choix{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem;}
.btn-mode{
  padding:20px 16px;border:2px solid var(--border-strong);border-radius:var(--r-lg);
  background:var(--surface);cursor:pointer;text-align:center;transition:all .2s;
  font-family:inherit;
}
.btn-mode:hover{border-color:#546054;background:rgba(84,96,84,.05);}
.btn-mode.actif{border-color:#546054;background:#546054;color:#fff;}
.btn-mode-icon{font-size:1.8rem;display:block;margin-bottom:6px;}
.btn-mode-label{font-weight:800;font-size:.9rem;}
.btn-mode-sous{font-size:.75rem;opacity:.75;margin-top:3px;}

/* Zone d'upload */
.zone-upload{
  border:2.5px dashed var(--border-strong);border-radius:var(--r-lg);
  padding:2rem;text-align:center;cursor:pointer;transition:all .2s;
  background:var(--surface);margin-bottom:1.2rem;
}
.zone-upload:hover,.zone-upload.dragover{border-color:#546054;background:rgba(84,96,84,.05);}
.zone-upload-icon{font-size:2rem;margin-bottom:.5rem;}
.zone-upload-texte{font-weight:700;font-size:.95rem;}
.zone-upload-sous{font-size:.8rem;color:var(--text-light);margin-top:4px;}
#input-cmd{display:none;}
#input-liv{display:none;}

/* Aperçu */
.apercu-bon{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:1rem;}
.apercu-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;}
.apercu-client{font-weight:800;font-size:1rem;color:#546054;}
.apercu-meta{font-family:var(--mono);font-size:.78rem;color:var(--text-light);}
.apercu-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.badge{padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:700;font-family:var(--mono);}
.badge-client{background:#546054;color:#fff;}
.badge-cmd{background:var(--wheat-light);color:var(--wheat);}

.date-retrait-bloc{background:var(--wheat-light);border:1.5px solid var(--wheat);border-radius:var(--r-lg);padding:12px 16px;margin-bottom:1rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.date-retrait-label{font-weight:700;font-size:.88rem;color:var(--wheat);flex-shrink:0;}
.date-retrait-input{padding:9px 12px;border:1.5px solid var(--wheat);border-radius:var(--r);font-family:var(--mono);font-size:.9rem;flex:1;min-width:130px;background:#fff;}

.lignes-titre{font-family:var(--mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-light);margin-bottom:.5rem;}
.nb-non-reconnus{background:#fff3cd;border:1px solid #ffc107;border-radius:var(--r);padding:8px 14px;font-size:.85rem;font-weight:600;margin-bottom:1rem;}

.ligne-produit{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-lg);margin-bottom:6px;}
.ligne-produit.reconnu{border-color:#38a169;background:#f0fff4;}
.ligne-produit.non-reconnu{border-color:#e53e3e;background:#fff5f5;}
.lp-code{font-family:var(--mono);font-size:.7rem;color:var(--text-light);width:60px;flex-shrink:0;}
.lp-designation{font-size:.82rem;color:var(--text-light);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lp-qte{font-family:var(--mono);font-weight:800;font-size:1rem;color:#546054;flex-shrink:0;}
.lp-recette{font-weight:700;font-size:.88rem;flex:1;}
.lp-recette select{width:100%;padding:6px 8px;border:1px solid var(--border-strong);border-radius:var(--r);font-size:.82rem;background:#fff;}

.btn-importer{width:100%;padding:16px;font-size:1.05rem;font-weight:800;background:#546054;color:#fff;border:none;border-radius:var(--r-lg);cursor:pointer;margin-top:1rem;}
.btn-importer:disabled{opacity:.4;cursor:not-allowed;}
.msg-succes{background:#f0fff4;border:1.5px solid #38a169;border-radius:var(--r-lg);padding:16px;text-align:center;display:none;margin-top:1rem;}
.msg-succes.visible{display:block;}
.msg-succes-titre{font-weight:800;font-size:1.1rem;color:#38a169;}
.msg-erreur-zone{background:#fff5f5;border:1.5px solid #e53e3e;border-radius:var(--r-lg);padding:12px 16px;margin-bottom:1rem;font-size:.88rem;color:#c53030;display:none;}
.msg-erreur-zone.visible{display:block;}
</style>
</head>
<body>
<div class="topbar">
  <span class="marque"><a href="accueil.html" class="retour">←</a> 📥 IMPORT PDF</span>
</div>
<main>

  <!-- Choix du mode -->
  <div class="mode-choix">
    <button class="btn-mode actif" id="btn-mode-cmd" onclick="setMode('commande')">
      <span class="btn-mode-icon">📋</span>
      <div class="btn-mode-label">Bon de commande</div>
      <div class="btn-mode-sous">Colibri Puilboreau / Angoulins</div>
    </button>
    <button class="btn-mode" id="btn-mode-liv" onclick="setMode('livraison')">
      <span class="btn-mode-icon">📦</span>
      <div class="btn-mode-label">Livraison / Facture</div>
      <div class="btn-mode-sous">Coup de Vague · Bourseau</div>
    </button>
  </div>

  <!-- ===== MODE COMMANDE ===== -->
  <div id="section-commande">
    <div class="zone-upload" id="zone-cmd" onclick="document.getElementById('input-cmd').click()">
      <div class="zone-upload-icon">📄</div>
      <div class="zone-upload-texte">Déposer le bon de commande PDF</div>
      <div class="zone-upload-sous">ou cliquer pour choisir</div>
    </div>
    <input type="file" id="input-cmd" accept=".pdf" onchange="traiterBonCommande_upload(this.files[0])">
    <div class="msg-erreur-zone" id="erreur-cmd"></div>

    <div id="apercu-cmd" style="display:none;">
      <div class="apercu-bon">
        <div class="apercu-header">
          <div>
            <div class="apercu-client" id="cmd-client-nom"></div>
            <div class="apercu-meta" id="cmd-meta"></div>
          </div>
          <div class="apercu-badges">
            <span class="badge badge-cmd" id="cmd-badge-no"></span>
          </div>
        </div>
      </div>
      <div class="date-retrait-bloc">
        <span class="date-retrait-label">📅 Date de retrait</span>
        <input type="date" id="cmd-date-retrait" class="date-retrait-input">
        <input type="time" id="cmd-heure-retrait" step="900" class="date-retrait-input" style="min-width:auto;flex:0;" placeholder="Heure">
      </div>
      <div class="lignes-titre">Produits — <span id="cmd-nb-lignes"></span></div>
      <div class="nb-non-reconnus" id="cmd-nb-nr" style="display:none;"></div>
      <div id="cmd-liste-lignes"></div>
      <div class="msg-succes" id="cmd-msg-succes">
        <div class="msg-succes-titre">✅ Commande importée !</div>
        <div id="cmd-msg-detail" style="margin-top:4px;font-size:.88rem;color:#2d6a4f;"></div>
      </div>
      <button class="btn-importer" id="cmd-btn-importer" onclick="importerCommande()">💾 Enregistrer la commande</button>
    </div>
  </div>

  <!-- ===== MODE LIVRAISON ===== -->
  <div id="section-livraison" style="display:none;">
    <div class="zone-upload" id="zone-liv" onclick="document.getElementById('input-liv').click()">
      <div class="zone-upload-icon">📄</div>
      <div class="zone-upload-texte">Déposer le bon de livraison ou la facture PDF</div>
      <div class="zone-upload-sous">Coup de Vague (BDL) · Minoterie Bourseau (Facture)</div>
    </div>
    <input type="file" id="input-liv" accept=".pdf" onchange="traiterLivraison_upload(this.files[0])">
    <div class="msg-erreur-zone" id="erreur-liv"></div>

    <div id="apercu-liv" style="display:none;">
      <div class="apercu-bon">
        <div class="apercu-header">
          <div>
            <div class="apercu-client" id="liv-fournisseur"></div>
            <div class="apercu-meta" id="liv-meta"></div>
          </div>
          <div class="apercu-badges">
            <span class="badge badge-cmd" id="liv-badge-ref"></span>
            <span class="badge badge-cmd" id="liv-badge-date"></span>
          </div>
        </div>
      </div>
      <div class="date-retrait-bloc">
        <span class="date-retrait-label">📅 Date de réception</span>
        <input type="date" id="liv-date-reception" class="date-retrait-input">
      </div>
      <div class="lignes-titre">Réceptions — <span id="liv-nb-lignes"></span></div>
      <div class="nb-non-reconnus" id="liv-nb-nr" style="display:none;"></div>
      <div id="liv-liste-lignes"></div>
      <div class="msg-succes" id="liv-msg-succes">
        <div class="msg-succes-titre">✅ Réceptions enregistrées !</div>
        <div id="liv-msg-detail" style="margin-top:4px;font-size:.88rem;color:#2d6a4f;"></div>
      </div>
      <button class="btn-importer" id="liv-btn-importer" onclick="importerLivraison()">📦 Enregistrer les réceptions</button>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/supabase-client.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let profilCourant = null;
let mapping = {};           // commandes Colibri
let mappingLivraison = {};  // livraison fournisseurs
let toutesRecettes = [];
let toutesMP = [];
let clientsPro = [];
let donneesCommande = null;
let donneesLivraison = null;

// ─── Init ─────────────────────────────────────────────────────────────────────
(async () => {
  profilCourant = await exigerRole(['gerant','boulanger','patissier','vendeur']);
  if (!profilCourant) return;

  const [
    { data: mappingCmd },
    { data: mappingLiv },
    { data: recs },
    { data: mps },
    { data: clients }
  ] = await Promise.all([
    sb.from('mapping_produits_fournisseur').select('code_article_externe, recette_id, variante_id, recettes(nom), recette_variantes(nom)').eq('actif', true),
    sb.from('mapping_articles_fournisseur').select('fournisseur_nom, code_article, designation, mp_id, matieres_premieres(nom)').eq('actif', true),
    sb.from('recettes').select('id, nom, metier').eq('actif', true).order('nom'),
    sb.from('matieres_premieres').select('id, nom, categorie').order('categorie').order('nom'),
    sb.from('clients').select('id, raison_sociale').eq('is_pro', true).order('raison_sociale')
  ]);

  (mappingCmd || []).forEach(m => {
    mapping[m.code_article_externe] = {
      recette_id: m.recette_id, variante_id: m.variante_id,
      nom: m.recettes?.nom + (m.recette_variantes ? ` (${m.recette_variantes.nom})` : '')
    };
  });
  (mappingLiv || []).forEach(m => {
    mappingLivraison[`${m.fournisseur_nom}|${m.code_article}`] = {
      mp_id: m.mp_id, nom: m.matieres_premieres?.nom || m.designation
    };
  });
  toutesRecettes = recs || [];
  toutesMP = mps || [];
  clientsPro = clients || [];

  // Drag & drop
  ['zone-cmd','zone-liv'].forEach(id => {
    const z = document.getElementById(id);
    z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('dragover'); });
    z.addEventListener('dragleave', e => { e.preventDefault(); z.classList.remove('dragover'); });
    z.addEventListener('drop', e => {
      e.preventDefault(); z.classList.remove('dragover');
      const f = e.dataTransfer.files[0];
      if (!f || f.type !== 'application/pdf') return;
      if (id === 'zone-cmd') traiterBonCommande_upload(f);
      else traiterLivraison_upload(f);
    });
  });
  document.body.addEventListener('dragover', e => e.preventDefault());
  document.body.addEventListener('drop', e => e.preventDefault());
})();

// ─── Bascule de mode ──────────────────────────────────────────────────────────
function setMode(mode) {
  document.getElementById('btn-mode-cmd').classList.toggle('actif', mode === 'commande');
  document.getElementById('btn-mode-liv').classList.toggle('actif', mode === 'livraison');
  document.getElementById('section-commande').style.display = mode === 'commande' ? '' : 'none';
  document.getElementById('section-livraison').style.display = mode === 'livraison' ? '' : 'none';
}

// ─── Extraction PDF commune ───────────────────────────────────────────────────
async function extraireTexte(file) {
  const ab = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: ab }).promise;
  const page = await pdf.getPage(1);
  const content = await page.getTextContent();
  return content.items.map(i => i.str).join(' ');
}

// ═══════════════════════════════════════════════════════════════════
// MODE COMMANDE
// ═══════════════════════════════════════════════════════════════════
async function traiterBonCommande_upload(file) {
  const zone = document.getElementById('zone-cmd');
  zone.innerHTML = `<div class="zone-upload-icon">⏳</div><div class="zone-upload-texte">Analyse…</div>`;
  document.getElementById('erreur-cmd').classList.remove('visible');
  try {
    const texte = await extraireTexte(file);

    let clientNom, clientType;
    if (/ANGOULINS/i.test(texte)) { clientNom = 'Colibri Angoulins'; clientType = 'angoulins'; }
    else if (/PUILBOREAU/i.test(texte)) { clientNom = 'Colibri Beaulieu'; clientType = 'beaulieu'; }
    else { clientNom = 'Fournisseur non reconnu'; clientType = null; }

    let noCommande = null;
    const m1 = texte.match(/(\d{4,6})\s+\d{2}\/\d{2}\/\d{4}/);
    const m2 = texte.match(/Cde\s+0*(\d+)/);
    if (m1) noCommande = m1[1];
    else if (m2) noCommande = m2[1];

    const articles = [];
    const re1 = /(\d{13})\s+FR\s+(.+?)\s+([\d,]+)\s*[€ÄA]\s+(\d+)\s+([\d,]+)/g;
    let m;
    while ((m = re1.exec(texte)) !== null)
      articles.push({ code: m[1], designation: m[2].trim(), quantite: parseInt(m[4]) });
    if (!articles.length) {
      const re2 = /(\d{13})\s+\1\s+FR\s+(.+?)\s+([\d,\.]+)\s+([\d\.]+)\s+([\d\.]+)/g;
      while ((m = re2.exec(texte)) !== null)
        articles.push({ code: m[1], designation: m[2].trim(), quantite: Math.round(parseFloat(m[3].replace(',','.'))) });
    }

    donneesCommande = { clientNom, clientType, noCommande, articles };

    // Affichage
    document.getElementById('cmd-client-nom').textContent = clientNom;
    document.getElementById('cmd-meta').textContent = `${articles.length} article(s)`;
    document.getElementById('cmd-badge-no').textContent = noCommande ? `Bon n°${noCommande}` : '—';
    const demain = new Date(); demain.setDate(demain.getDate()+1);
    document.getElementById('cmd-date-retrait').value = demain.toISOString().slice(0,10);
    document.getElementById('cmd-nb-lignes').textContent = `${articles.length} articles`;

    let nbNR = 0;
    const optRec = toutesRecettes.map(r => `<option value="${r.id}">${r.nom}</option>`).join('');
    document.getElementById('cmd-liste-lignes').innerHTML = articles.map((a, i) => {
      const mp = mapping[a.code];
      if (mp) return `<div class="ligne-produit reconnu">
        <span class="lp-code">${a.code.slice(-4)}</span>
        <span class="lp-designation" title="${a.designation}">${a.designation}</span>
        <span class="lp-qte">${a.quantite}</span>
        <span class="lp-recette">${mp.nom}</span> ✓
      </div>`;
      nbNR++;
      return `<div class="ligne-produit non-reconnu">
        <span class="lp-code">${a.code.slice(-4)}</span>
        <span class="lp-designation" title="${a.designation}">${a.designation}</span>
        <span class="lp-qte">${a.quantite}</span>
        <div class="lp-recette"><select id="assoc-cmd-${i}" onchange="memoriserCmd('${a.code}','${a.designation}',this.value)">
          <option value="">— Associer —</option>${optRec}
        </select></div>
      </div>`;
    }).join('');

    const blocNR = document.getElementById('cmd-nb-nr');
    if (nbNR > 0) { blocNR.style.display='block'; blocNR.textContent=`⚠️ ${nbNR} produit(s) non reconnu(s) — associez-les.`; }
    else blocNR.style.display='none';

    document.getElementById('apercu-cmd').style.display = 'block';
    zone.innerHTML = `<div class="zone-upload-icon">✅</div><div class="zone-upload-texte">${articles.length} articles analysés</div><div class="zone-upload-sous">Cliquer pour changer de fichier</div>`;
  } catch(e) {
    zone.innerHTML = `<div class="zone-upload-icon">📄</div><div class="zone-upload-texte">Déposer le bon de commande PDF</div><div class="zone-upload-sous">ou cliquer pour choisir</div>`;
    const err = document.getElementById('erreur-cmd');
    err.textContent = `Erreur : ${e.message}`; err.classList.add('visible');
  }
}

async function memoriserCmd(code, designation, recetteId) {
  if (!recetteId) return;
  const rec = toutesRecettes.find(r => r.id === recetteId);
  await sb.from('mapping_produits_fournisseur').upsert({ code_article_externe: code, designation_externe: designation, recette_id: recetteId, client_pro_id: null, actif: true }, { onConflict: 'client_pro_id,code_article_externe' });
  mapping[code] = { recette_id: recetteId, variante_id: null, nom: rec?.nom || designation };
  if (donneesCommande) traiterBonCommande_upload(null); // pas idéal mais OK
}

async function importerCommande() {
  const dateRetrait = document.getElementById('cmd-date-retrait').value;
  const heureRetrait = document.getElementById('cmd-heure-retrait').value || null;
  if (!dateRetrait) { alert('Date de retrait obligatoire.'); return; }
  if (!donneesCommande) return;

  const { clientType, noCommande, articles } = donneesCommande;
  const clientPro = clientsPro.find(c => clientType === 'angoulins' ? /angoulins/i.test(c.raison_sociale) : /beaulieu/i.test(c.raison_sociale));
  if (!clientPro) { alert('Client introuvable en base.'); return; }

  const nonRes = articles.filter(a => !mapping[a.code]);
  if (nonRes.length) { alert(`${nonRes.length} produit(s) non associé(s).`); return; }

  const btn = document.getElementById('cmd-btn-importer');
  btn.disabled = true; btn.textContent = 'Enregistrement…';
  try {
    const { data: cmd, error: errCmd } = await sb.from('commandes').insert({
      client_id: clientPro.id, date_retrait: dateRetrait, heure_retrait: heureRetrait,
      statut: 'todo', collectee: false, pris_par: profilCourant.id,
      contenu: `Import PDF — Bon n°${noCommande || '?'}`
    }).select().single();
    if (errCmd) throw errCmd;

    const { error: errL } = await sb.from('commande_lignes').insert(
      articles.map(a => ({ commande_id: cmd.id, recette_id: mapping[a.code].recette_id, variante_id: mapping[a.code].variante_id || null, quantite: a.quantite }))
    );
    if (errL) throw errL;

    document.getElementById('cmd-msg-succes').classList.add('visible');
    document.getElementById('cmd-msg-detail').textContent = `${articles.length} produits · ${donneesCommande.clientNom} · retrait le ${new Date(dateRetrait).toLocaleDateString('fr-FR')}`;
    btn.textContent = '✅ Importé';
  } catch(e) { alert('Erreur : '+e.message); btn.disabled=false; btn.textContent='💾 Enregistrer la commande'; }
}

// ═══════════════════════════════════════════════════════════════════
// MODE LIVRAISON
// ═══════════════════════════════════════════════════════════════════
async function traiterLivraison_upload(file) {
  const zone = document.getElementById('zone-liv');
  zone.innerHTML = `<div class="zone-upload-icon">⏳</div><div class="zone-upload-texte">Analyse…</div>`;
  document.getElementById('erreur-liv').classList.remove('visible');
  try {
    const texte = await extraireTexte(file);

    let fournisseur, noBdl, dateLiv, articles = [];

    if (/MINOTERIE\s+BOURSEAU/i.test(texte)) {
      fournisseur = 'MINOTERIE BOURSEAU';
      const dateM = texte.match(/(\d{2}\/\d{2}\/\d{4})\s+(\d{9})/);
      const noPiece = dateM ? dateM[2] : '?';
      const bdlM = texte.match(/BON DE LIVRAISON N°\s*(\d+)\s+(\d{2}\/\d{2}\/\d{4})/);
      noBdl = bdlM ? bdlM[1] : noPiece;
      dateLiv = bdlM ? bdlM[2] : (dateM ? dateM[1] : null);
      const re = /(\d{2,3})\s+(FAR[\w.\s-]+?(?:BIO|S25|R2|CYL|BAGATELLE)(?:\s+S25)?(?:\s+\(\d\))?)\s+(\d+)\s+SAC\s+-\s+25\s+KG\s+(-?\d+)/g;
      let m;
      while ((m = re.exec(texte)) !== null) {
        const poids = Math.abs(parseInt(m[4]));
        if (poids > 0) articles.push({ code: m[1], designation: m[2].trim(), lots: [{ num: noBdl, qte: poids, dlc: null, unite: 'kg' }], fournisseur });
      }

    } else if (/Oeufs d'Antan|OEUFS D'ANTAN/i.test(texte)) {
      fournisseur = "LES OEUFS D'ANTAN";
      const blM = texte.match(/Bon de livraison n°\s*(\d+)/i);
      noBdl = blM ? blM[1] : '?';
      const dateM = texte.match(/^(\d{2}\/\d{2}\/\d{4})/m);
      dateLiv = dateM ? dateM[1] : null;
      const lignes = texte.split('\n');
      for (let i = 0; i < lignes.length; i++) {
        const lotM = lignes[i].match(/N°\s+lot\s+(\S+)/);
        if (lotM && i+1 < lignes.length) {
          const artM = lignes[i+1].match(/(A\d+)\s+(.+?)\s+([\d.,]+)\s+€\s*\/\s*Unité\s+(\d+)/);
          if (artM) {
            let dlc = null;
            if (i+2 < lignes.length) {
              const dlcM = lignes[i+2].match(/DLC\s+(\d{2}\/\d{2}\/\d{2,4})/);
              if (dlcM) dlc = dlcM[1];
            }
            articles.push({
              code: artM[1], designation: artM[2].trim(),
              lots: [{ num: lotM[1], qte: parseInt(artM[4]), dlc, unite: 'pièce' }],
              fournisseur
            });
          }
        }
      }

    } else {
      fournisseur = 'COUP DE VAGUE';
      const noBdlM = texte.match(/N°\s*:\s*(BDL\S+)/);
      noBdl = noBdlM ? noBdlM[1] : '?';
      const dateLivM = texte.match(/Date de livraison\s*:\s*(\d{2}\/\d{2}\/\d{4})/);
      dateLiv = dateLivM ? dateLivM[1] : null;
      const lignes = texte.split(/\s{2,}|\n/).map(l => l.trim()).filter(Boolean);
      for (let i = 0; i < lignes.length; i++) {
        const artM = lignes[i].match(/^(ART\d+)\s+-(.+?)\s+([\d,]+)\s+kg$/);
        if (artM) {
          const quantite = parseFloat(artM[3].replace(',','.'));
          const lots = [];
          let j = i+1;
          while (j < lignes.length) {
            if (/^ART\d+|^Produits|^Règlement|^Bon pour/.test(lignes[j])) break;
            for (const lm of lignes[j].matchAll(/(?:lot\s+)?(\d{6,})(?:=(\d+)\s*kg)?/gi))
              lots.push({ num: lm[1], qte: lm[2] ? parseFloat(lm[2]) : quantite });
            j++;
          }
          if (!lots.length) lots.push({ num: '', qte: quantite });
          articles.push({ code: artM[1], designation: artM[2].trim(), lots, fournisseur });
          i = j-1;
        }
      }
    }

    donneesLivraison = { fournisseur, noBdl, dateLiv, articles };
    const nbReceptions = articles.reduce((s,a) => s+a.lots.length, 0);

    document.getElementById('liv-fournisseur').textContent = fournisseur;
    document.getElementById('liv-meta').textContent = `${articles.length} produit(s) · ${nbReceptions} réception(s)`;
    document.getElementById('liv-badge-ref').textContent = noBdl;
    document.getElementById('liv-badge-date').textContent = dateLiv ? `Livraison ${dateLiv}` : '—';
    document.getElementById('liv-nb-lignes').textContent = `${nbReceptions} réceptions`;

    if (dateLiv) {
      const p = dateLiv.split('/');
      document.getElementById('liv-date-reception').value = `${p[2]}-${p[1]}-${p[0]}`;
    } else {
      document.getElementById('liv-date-reception').value = new Date().toISOString().slice(0,10);
    }

    const optMP = toutesMP.map(m => `<option value="${m.id}">${m.nom}</option>`).join('');
    let nbNR = 0, idx = 0;
    document.getElementById('liv-liste-lignes').innerHTML = articles.flatMap(a => {
      const cle = `${a.fournisseur}|${a.code}`;
      const mp = mappingLivraison[cle];
      return a.lots.map(lot => {
        const i = idx++;
        if (mp && mp.mp_id) return `<div class="ligne-produit reconnu">
          <div style="flex:1;min-width:0;">
            <div style="font-weight:700;">${a.designation}</div>
            <div style="font-size:.72rem;color:#2d6a4f;font-family:var(--mono);">Lot ${lot.num||'—'} · <strong>${mp.nom}</strong>${lot.dlc ? ` · DLC ${lot.dlc}` : ''}</div>
          </div>
          <span class="lp-qte">${lot.qte} ${lot.unite||'kg'} ✓</span>
          <input type="hidden" id="liv-mp-${i}" value="${mp.mp_id}">
          <input type="hidden" id="liv-lot-${i}" value="${lot.num}">
          <input type="hidden" id="liv-qte-${i}" value="${lot.qte}">
          <input type="hidden" id="liv-dlc-${i}" value="${lot.dlc||''}">
          <input type="hidden" id="liv-unite-${i}" value="${lot.unite||'kg'}">
        </div>`;
        nbNR++;
        return `<div class="ligne-produit non-reconnu">
          <div style="flex:1;min-width:0;">
            <div style="font-weight:700;">${a.code} — ${a.designation}</div>
            <div style="font-size:.72rem;color:var(--text-light);font-family:var(--mono);">Lot ${lot.num||'—'} · ${lot.qte} ${lot.unite||'kg'}${lot.dlc ? ` · DLC ${lot.dlc}` : ''}</div>
            <select id="liv-mp-${i}" style="margin-top:4px;width:100%;padding:6px;font-size:.82rem;border:1px solid var(--border-strong);border-radius:var(--r);" onchange="memoriserLiv('${a.fournisseur}','${a.code}','${a.designation}',this.value)">
              <option value="">— Associer à une matière —</option>${optMP}
            </select>
          </div>
          <input type="hidden" id="liv-lot-${i}" value="${lot.num}">
          <input type="hidden" id="liv-qte-${i}" value="${lot.qte}">
          <input type="hidden" id="liv-dlc-${i}" value="${lot.dlc||''}">
          <input type="hidden" id="liv-unite-${i}" value="${lot.unite||'kg'}">
        </div>`;
      });
    }).join('');

    const blocNR = document.getElementById('liv-nb-nr');
    if (nbNR > 0) { blocNR.style.display='block'; blocNR.textContent=`⚠️ ${nbNR} produit(s) non reconnu(s) — associez-les.`; }
    else blocNR.style.display='none';

    document.getElementById('apercu-liv').style.display = 'block';
    zone.innerHTML = `<div class="zone-upload-icon">✅</div><div class="zone-upload-texte">${nbReceptions} réceptions analysées</div><div class="zone-upload-sous">Cliquer pour changer de fichier</div>`;
  } catch(e) {
    zone.innerHTML = `<div class="zone-upload-icon">📄</div><div class="zone-upload-texte">Déposer le bon de livraison ou la facture PDF</div><div class="zone-upload-sous">Coup de Vague · Minoterie Bourseau</div>`;
    const err = document.getElementById('erreur-liv');
    err.textContent = `Erreur : ${e.message}`; err.classList.add('visible');
  }
}

async function memoriserLiv(fournisseur, code, designation, mpId) {
  if (!mpId) return;
  const mp = toutesMP.find(m => m.id === mpId);
  await sb.from('mapping_articles_fournisseur').upsert({ fournisseur_nom: fournisseur, code_article: code, designation, mp_id: mpId, actif: true }, { onConflict: 'fournisseur_nom,code_article' });
  mappingLivraison[`${fournisseur}|${code}`] = { mp_id: mpId, nom: mp?.nom || designation };
}

async function importerLivraison() {
  const dateReception = document.getElementById('liv-date-reception').value;
  if (!dateReception) { alert('Date de réception obligatoire.'); return; }
  if (!donneesLivraison) return;

  const btn = document.getElementById('liv-btn-importer');
  btn.disabled = true; btn.textContent = 'Enregistrement…';

  const els = document.querySelectorAll('[id^="liv-qte-"]');
  const receptions = [];
  let erreur = false;

  els.forEach((el, i) => {
    const mpId = document.getElementById(`liv-mp-${i}`)?.value;
    if (!mpId) { erreur = true; return; }
    const dlcVal = document.getElementById(`liv-dlc-${i}`)?.value || '';
    const uniteVal = document.getElementById(`liv-unite-${i}`)?.value || 'kg';
    // Convertir DLC "DD/MM/YY" ou "DD/MM/YYYY" en ISO
    let dlcIso = null;
    if (dlcVal) {
      const p = dlcVal.split('/');
      if (p.length === 3) {
        const year = p[2].length === 2 ? '20'+p[2] : p[2];
        dlcIso = `${year}-${p[1]}-${p[0]}`;
      }
    }
    receptions.push({
      mp_id: mpId,
      fournisseur: donneesLivraison.fournisseur,
      n_lot: document.getElementById(`liv-lot-${i}`)?.value || donneesLivraison.noBdl,
      n_certificat_bio: 'FR-BIO-01',
      quantite: parseFloat(el.value || 0),
      unite_quantite: uniteVal,
      date_reception: dateReception,
      etat_emballage: 'correct',
      conforme: true,
      ...(dlcIso ? { dlc: dlcIso } : {})
    });
  });

  if (erreur) { alert('Certains produits ne sont pas associés.'); btn.disabled=false; btn.textContent='📦 Enregistrer les réceptions'; return; }

  const { error } = await sb.from('tracabilite_lots').insert(receptions);
  if (error) { alert('Erreur : '+error.message); btn.disabled=false; btn.textContent='📦 Enregistrer les réceptions'; return; }

  document.getElementById('liv-msg-succes').classList.add('visible');
  document.getElementById('liv-msg-detail').textContent = `${receptions.length} réception(s) créée(s) dans Traçabilité · ${donneesLivraison.fournisseur}`;
  btn.textContent = '✅ Enregistré';
}
</script>
